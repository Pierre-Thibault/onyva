[project]
name = "onyva"
version = "0.1.0"
description = "Personal data management tool"
requires-python = ">=3.14"
dependencies = [
    "babel",
    "bottle",
    "dynaconf",
    "mako",
    "marko",
    "pydantic>=2.12.5",
    "pyyaml",
    "structlog",
]

[dependency-groups]
dev = [
    "basedpyright",
    "icecream",
    "pytest",
    "pytest-bdd",
    "pytest-cov",
    "ruff",
    "sphinx",
    "sphinx-intl",
    "sphinxcontrib-mermaid",
    "tox",
    "webtest",
]

[tool.ruff.lint]
select = [
    "D",     # pydocstyle - docstring conventions
    "T203",  # Detect leftover icecream (ic) calls
]
ignore = [
    "D104",  # Missing docstring in public package (__init__.py)
    "D203",  # Conflicts with D211 (no blank line before class docstring)
    "D213",  # Conflicts with D212 (multi-line summary first line)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]                # No docstrings required in tests
"docs/**/conf.py" = ["D100"]           # Sphinx config files
"src/onyva/core/models.py" = ["D"]     # TODO: fix docstrings

[project.scripts]
onyva = "onyva.web.app:run"
check = "scripts.check:main"
docs = "scripts.docs:main"
i18n = "scripts.i18n:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/onyva"]
branch = true
omit = ["src/scripts/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
