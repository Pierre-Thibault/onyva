[project]
name = "onyva"
version = "0.1.0"
description = "Personal data management tool"
requires-python = ">=3.14"
dependencies = [
    "babel",                # i18n: string extraction, translation catalogs, locale formatting
    "bottle",               # web: lightweight WSGI framework
    "dynaconf",             # configuration management with environment support
    "mako",                 # web: HTML templating engine
    "marko",
    "pydantic>=2.12.5",     # data models with validation
    "pyyaml",               # parser: YAML parsing for todo metadata
    "structlog",            # structured logging
    "toolz",                # functional utilities: compose, curry, groupby, etc.
]

[dependency-groups]
dev = [
    "basedpyright",         # strict static type checker
    "icecream",             # debug printing (must not appear in committed code)
    "pytest",               # test framework
    "pytest-bdd",           # BDD-style tests with Gherkin scenarios
    "pytest-cov",           # test coverage measurement
    "ruff",                 # linter and formatter
    "sphinx",               # documentation builder
    "sphinx-intl",          # Sphinx i18n support for multi-language docs
    "sphinxcontrib-mermaid", # Mermaid diagram support in Sphinx
    "tox",                  # test environment automation
    "webtest",              # HTTP testing for WSGI apps
]

[tool.ruff.lint]
select = [
    "D",     # pydocstyle - docstring conventions
    "T203",  # Detect leftover icecream (ic) calls
]
ignore = [
    "D104",  # Missing docstring in public package (__init__.py)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]                # No docstrings required in tests
"docs/**/conf.py" = ["D100"]           # Sphinx config files

[project.scripts]
onyva = "onyva.web.app:run"
check = "scripts.check:main"
docs = "scripts.docs:main"
i18n = "scripts.i18n:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/onyva"]
branch = true
omit = ["src/scripts/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
